name: Java CI with Maven

on:
  push:
    branches: ["github-actions"]
  pull_request:
    branches: ["github-actions"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Install local dashedlines library
        run: >
          mvn org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file
          -Dfile=dashedlines/library/dashedlines.jar
          -DgroupId=garciadelcastillo
          -DartifactId=dashedlines
          -Dversion=1.0
          -Dpackaging=jar
          -DgeneratePom=true

      - name: Build with Maven (skip tests)
        run: mvn -B -DskipTests package --file Visualisation_of_algrotihm/pom.xml

      - name: Attach JAR to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Visualisation_of_algrotihm/target/*.jar

      - name: Update dependency graph
        if: github.event_name != 'release'
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
